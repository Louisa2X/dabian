<svg xmlns="http://www.w3.org/2000/svg" width="140" height="160" viewBox="0 0 140 160" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <!-- 文件阴影 -->
  <rect x="28" y="8" width="88" height="112" rx="6" fill="#000" opacity="0.1"/>

  <!-- 文件主体（Word 蓝色） -->
  <rect x="24" y="4" width="88" height="112" rx="6" fill="#2B579A"/>

  <!-- 右上角折角 -->
  <path d="M76 4 L112 4 L112 36 Q112 40 108 40 L80 40 Q76 40 76 36 Z" fill="#1E3F6E"/>
  <path d="M76 4 L76 36 Q76 40 80 40 L112 40" fill="none" stroke="#4A7BC8" stroke-width="1"/>

  <!-- 折角上的 W 标志 -->
  <text x="92" y="28" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">W</text>

  <!-- 文档内容区（白色背景模拟页面） -->
  <rect x="32" y="48" width="72" height="60" rx="2" fill="#FFFFFF"/>

  <!-- 模拟文档内容线条 -->
  <rect x="40" y="56" width="48" height="4" rx="2" fill="#D0D5DD"/>
  <rect x="40" y="66" width="56" height="3" rx="1.5" fill="#E8EAED"/>
  <rect x="40" y="74" width="52" height="3" rx="1.5" fill="#E8EAED"/>
  <rect x="40" y="82" width="44" height="3" rx="1.5" fill="#E8EAED"/>
  <rect x="40" y="90" width="56" height="3" rx="1.5" fill="#E8EAED"/>
  <rect x="40" y="98" width="36" height="3" rx="1.5" fill="#E8EAED"/>

  <!-- 底部文件名标签 -->
  <text x="70" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">Skill入门指南</text>
  <text x="70" y="155" text-anchor="middle" font-size="12" font-weight="600" fill="#6B7280">.docx</text>
</svg>
