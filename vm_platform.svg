<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0052D9"/></marker>
    <marker id="arc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00A6A6"/></marker>
    <marker id="arp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
    <linearGradient id="pg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3FF"/><stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="dg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0FAFC"/><stop offset="100%" stop-color="#E6FFFB"/>
    </linearGradient>
  </defs>

  <!-- ═══ 左侧：三大痛点（仅标题） ═══ -->
  <g transform="translate(4, 10)">
    <rect x="0" y="0" width="120" height="130" rx="10" fill="url(#pg)" stroke="#C4B5FD" stroke-width="1.2"/>
    <rect x="0" y="0" width="120" height="28" rx="10" fill="#7C3AED"/>
    <rect x="0" y="16" width="120" height="12" fill="#7C3AED"/>
    <text x="60" y="19" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">三大痛点</text>

    <text x="60" y="54" text-anchor="middle" font-size="13" font-weight="800" fill="#7C3AED">① 存储割裂</text>
    <text x="60" y="78" text-anchor="middle" font-size="13" font-weight="800" fill="#7C3AED">② 查询孤岛</text>
    <text x="60" y="102" text-anchor="middle" font-size="13" font-weight="800" fill="#7C3AED">③ AI 缺地基</text>
  </g>

  <!-- ═══ 右上：四个数据指标 ═══ -->
  <g transform="translate(296, 10)">
    <rect x="0" y="0" width="98" height="40" rx="6" fill="url(#dg)" stroke="#00D4AA" stroke-width="1.1"/>
    <text x="9" y="19" font-size="16" font-weight="900" fill="#00B894">9.1<tspan font-size="14" font-weight="800">万</tspan></text>
    <text x="9" y="33" font-size="8.5" font-weight="700" fill="#374151">Setats 写入 TPS</text>

    <rect x="104" y="0" width="98" height="40" rx="6" fill="url(#dg)" stroke="#00D4AA" stroke-width="1.1"/>
    <text x="113" y="19" font-size="16" font-weight="900" fill="#00B894">20<tspan font-size="14" font-weight="800">亿</tspan></text>
    <text x="113" y="33" font-size="8.5" font-weight="700" fill="#374151">线上最大规模</text>

    <rect x="208" y="0" width="98" height="40" rx="6" fill="url(#dg)" stroke="#00D4AA" stroke-width="1.1"/>
    <text x="217" y="19" font-size="16" font-weight="900" fill="#00B894">1000</text>
    <text x="217" y="33" font-size="8.5" font-weight="700" fill="#374151">OLAP 压测 QPS</text>

    <rect x="312" y="0" width="98" height="40" rx="6" fill="url(#dg)" stroke="#00D4AA" stroke-width="1.1"/>
    <text x="321" y="19" font-size="16" font-weight="900" fill="#00B894">40%</text>
    <text x="321" y="33" font-size="8.5" font-weight="700" fill="#374151">存储成本降低</text>
  </g>

  <!-- ═══ 中下：VM 流式架构主图 ═══ -->
  <g transform="translate(132, 60)">
    <!-- 连线 -->
    <path d="M156,72 C248,72 248,152 322,152" fill="none" stroke="#00A6A6" stroke-width="2.2" marker-end="url(#arc)"/>
    <path d="M156,228 C248,228 248,176 322,176" fill="none" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#arp)"/>
    <path d="M452,164 L512,164" fill="none" stroke="#0052D9" stroke-width="2.2" marker-end="url(#ar)"/>
    <path d="M662,164 L718,164" fill="none" stroke="#0052D9" stroke-width="2.2" marker-end="url(#ar)"/>
    <path d="M587,198 L587,250" fill="none" stroke="#9AA3B2" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ar)"/>

    <!-- 双源 -->
    <rect x="14" y="34" width="142" height="76" rx="9" fill="#FFFFFF" stroke="#00A6A6" stroke-width="2"/>
    <text x="85" y="62" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0A7C86">车辆信号 JSON</text>
    <text x="85" y="82" text-anchor="middle" font-size="12" fill="#5A5A6E">TSP 实时流</text>
    <text x="85" y="98" text-anchor="middle" font-size="12" fill="#5A5A6E">CKafka 缓冲</text>

    <rect x="14" y="190" width="142" height="66" rx="9" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <text x="85" y="222" text-anchor="middle" font-size="15.5" font-weight="700" fill="#6D28D9">业务库变更</text>
    <text x="85" y="244" text-anchor="middle" font-size="12" fill="#5A5A6E">MySQL binlog CDC</text>

    <!-- 三蓝框 -->
    <rect x="324" y="130" width="128" height="60" rx="9" fill="#F0F4FF" stroke="#0052D9" stroke-width="2"/>
    <text x="388" y="158" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0052D9">Oceanus</text>
    <text x="388" y="178" text-anchor="middle" font-size="11.5" fill="#5A5A6E">Flink 流式，多流关联</text>

    <rect x="514" y="120" width="148" height="80" rx="9" fill="#F0F4FF" stroke="#0052D9" stroke-width="2"/>
    <text x="588" y="150" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0052D9">Iceberg</text>
    <text x="588" y="170" text-anchor="middle" font-size="11.5" fill="#5A5A6E">ODS→DWD→ADS 分层</text>
    <text x="588" y="188" text-anchor="middle" font-size="11.5" fill="#0052D9" font-weight="700">DataBuddy 智能问数</text>

    <rect x="720" y="130" width="124" height="60" rx="9" fill="#F0F4FF" stroke="#0052D9" stroke-width="2"/>
    <text x="782" y="158" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0052D9">Doris</text>
    <text x="782" y="178" text-anchor="middle" font-size="11.5" fill="#5A5A6E">TCHouse-D 引擎解耦</text>

    <!-- Spark backfill -->
    <rect x="444" y="250" width="286" height="56" rx="9" fill="#FFFFFF" stroke="#9AA3B2" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="587" y="276" text-anchor="middle" font-size="13.5" font-weight="700" fill="#5A5A6E">Spark 离线校准 backfill</text>
    <text x="587" y="296" text-anchor="middle" font-size="11.5" fill="#9AA3B2">SeTATS 流湖引擎 · <tspan fill="#0A7C86" font-weight="700">流湖统一</tspan></text>
  </g>
</svg>
