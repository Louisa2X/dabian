<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3DB5B0"/>
    </marker>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9AA0A6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="600" fill="#FFFFFF"/>

  <!-- title -->
  <!-- 标题已由 HTML h3 提供，此处删除 -->

  <!-- ============ Section A: 数据闭环 outer loop ============ -->
  <text x="40" y="124" font-size="19" font-weight="700" fill="#3DB5B0">① 数据闭环（端到端迭代）</text>
  <!-- 7 stage boxes -->
  <g font-size="15">
    <rect x="40" y="138" width="195" height="64" rx="10" fill="#F7F8FA" stroke="#E2E5EA" stroke-width="2"/>
    <text x="137" y="166" text-anchor="middle" font-weight="700" fill="#1A1A1A">车端采集</text>
    <text x="137" y="188" text-anchor="middle" fill="#888">传感器/摄像头/激光雷达</text>

    <rect x="253" y="138" width="195" height="64" rx="10" fill="#EAF7F6" stroke="#3DB5B0" stroke-width="2"/>
    <text x="350" y="166" text-anchor="middle" font-weight="700" fill="#1A1A1A">量产数据回传</text>
    <text x="350" y="188" text-anchor="middle" fill="#3DB5B0">认证·分片·COS</text>

    <rect x="466" y="138" width="195" height="64" rx="10" fill="#F7F8FA" stroke="#E2E5EA" stroke-width="2"/>
    <text x="563" y="166" text-anchor="middle" font-weight="700" fill="#1A1A1A">云端存储</text>
    <text x="563" y="188" text-anchor="middle" fill="#888">COS·合规</text>

    <rect x="679" y="138" width="195" height="64" rx="10" fill="#F7F8FA" stroke="#E2E5EA" stroke-width="2"/>
    <text x="776" y="166" text-anchor="middle" font-weight="700" fill="#1A1A1A">解析清洗</text>
    <text x="776" y="188" text-anchor="middle" fill="#888">时空对齐</text>

    <rect x="892" y="138" width="195" height="64" rx="10" fill="#F7F8FA" stroke="#E2E5EA" stroke-width="2"/>
    <text x="989" y="166" text-anchor="middle" font-weight="700" fill="#1A1A1A">标注</text>
    <text x="989" y="188" text-anchor="middle" fill="#888">4D/激光/OCC</text>

    <rect x="1105" y="138" width="195" height="64" rx="10" fill="#F7F8FA" stroke="#E2E5EA" stroke-width="2"/>
    <text x="1202" y="166" text-anchor="middle" font-weight="700" fill="#1A1A1A">模型训练调优</text>
    <text x="1202" y="188" text-anchor="middle" fill="#888">Ray·PyTorch</text>

    <rect x="1318" y="138" width="195" height="64" rx="10" fill="#F7F8FA" stroke="#E2E5EA" stroke-width="2"/>
    <text x="1415" y="166" text-anchor="middle" font-weight="700" fill="#1A1A1A">量产部署·OTA</text>
    <text x="1415" y="188" text-anchor="middle" fill="#888">影子模式</text>
  </g>
  <!-- arrows between boxes -->
  <line x1="235" y1="170" x2="251" y2="170" stroke="#3DB5B0" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="448" y1="170" x2="464" y2="170" stroke="#3DB5B0" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="661" y1="170" x2="677" y2="170" stroke="#3DB5B0" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="874" y1="170" x2="890" y2="170" stroke="#3DB5B0" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1087" y1="170" x2="1103" y2="170" stroke="#3DB5B0" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1300" y1="170" x2="1316" y2="170" stroke="#3DB5B0" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 实车运营 node + loop -->
  <rect x="560" y="214" width="480" height="50" rx="10" fill="#F0F4F8" stroke="#9AA0A6" stroke-width="2"/>
  <text x="800" y="245" text-anchor="middle" font-size="16" font-weight="700" fill="#444">实车运营 · 影子模式（产生新场景数据）</text>
  <path d="M1415,202 V238 H800 V214" fill="none" stroke="#9AA0A6" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <path d="M560,238 V292 H137 V196" fill="none" stroke="#9AA0A6" stroke-width="2.5" marker-end="url(#arrowG)"/>

  <!-- ============ Section B: 量产回传详细链路 ============ -->
  <text x="40" y="345" font-size="19" font-weight="700" fill="#3DB5B0">② 量产回传详细链路</text>

  <rect x="40" y="365" width="240" height="92" rx="12" fill="#FFFFFF" stroke="#D0D3D8" stroke-width="2"/>
  <text x="160" y="400" text-anchor="middle" font-size="18" font-weight="700" fill="#1A1A1A">车端本体</text>
  <text x="160" y="428" text-anchor="middle" font-size="14" fill="#888">传感器/摄像头/激光雷达</text>

  <rect x="315" y="365" width="250" height="92" rx="12" fill="#EAF7F6" stroke="#3DB5B0" stroke-width="2"/>
  <rect x="315" y="365" width="250" height="8" rx="4" fill="#3DB5B0"/>
  <text x="440" y="402" text-anchor="middle" font-size="17" font-weight="700" fill="#1A1A1A">车云双向认证</text>
  <text x="440" y="428" text-anchor="middle" font-size="14" fill="#333">双向 CA 身份认证</text>

  <rect x="600" y="365" width="190" height="92" rx="12" fill="#FFFFFF" stroke="#D0D3D8" stroke-width="2"/>
  <text x="695" y="400" text-anchor="middle" font-size="18" font-weight="700" fill="#1A1A1A">直连 COS</text>
  <text x="695" y="428" text-anchor="middle" font-size="14" fill="#888">对象存储</text>

  <rect x="825" y="365" width="240" height="92" rx="12" fill="#FFFFFF" stroke="#D0D3D8" stroke-width="2"/>
  <text x="945" y="400" text-anchor="middle" font-size="18" font-weight="700" fill="#1A1A1A">解密 · 脱敏 · 抽帧</text>
  <text x="945" y="428" text-anchor="middle" font-size="14" fill="#888">云端实时处理</text>

  <rect x="1100" y="365" width="460" height="92" rx="12" fill="#FFFFFF" stroke="#D0D3D8" stroke-width="2"/>
  <text x="1330" y="400" text-anchor="middle" font-size="18" font-weight="700" fill="#1A1A1A">合规存储 → 数据湖</text>
  <text x="1330" y="428" text-anchor="middle" font-size="14" fill="#888">标注 · 训练 · 仿真测评</text>

  <line x1="280" y1="411" x2="313" y2="411" stroke="#3DB5B0" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="565" y1="411" x2="598" y2="411" stroke="#3DB5B0" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="790" y1="411" x2="823" y2="411" stroke="#3DB5B0" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1065" y1="411" x2="1098" y2="411" stroke="#3DB5B0" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="600" y="338" width="190" height="24" rx="12" fill="#3DB5B0"/>
  <text x="695" y="355" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">百万级并发 · 分钟级时延</text>

  <!-- ============ Integrated annotations (no cards) ============ -->
  <g font-size="12" fill="#333">
    <!-- 双向认证 -->
    <text x="320" y="486">正向·车端验云端 CA 根证书，防中间人</text>
    <text x="320" y="508">反向·云端验车端证书（唯一 VIN），防非法接入</text>
    <text x="320" y="530" font-size="12.5" font-weight="700" fill="#1559C4">→ 解决：合法接入 + 来源可信</text>

    <!-- 分片断点 -->
    <text x="605" y="486">分片上传 + 断点续传，数据不丢失</text>
    <text x="605" y="508" font-size="12.5" font-weight="700" fill="#1559C4">→ 解决：大文件可靠传输</text>

    <!-- 脱敏合规 -->
    <text x="830" y="486">端侧实时脱敏：人脸/车牌模糊化</text>
    <text x="830" y="508">坐标偏转 · 电子围栏敏感区过滤</text>
    <text x="830" y="530">物理隔离 · 合规云访问控制</text>
    <text x="830" y="552" font-size="12.5" font-weight="700" fill="#1559C4">→ 解决：个信 / 地信合规</text>
  </g>
</svg>